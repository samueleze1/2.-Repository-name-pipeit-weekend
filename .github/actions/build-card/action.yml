name: Build status card
description: Makes a web page that shows who built it, when, and that the checks passed

inputs:
  name:
    description: Your name, shown on the page
    required: true
  message:
    description: A short message for visitors
    required: false
    default: Built automatically by my own GitHub Action

outputs:
  page:
    description: Where the page was written
    value: site/index.html

runs:
  using: composite
  steps:
    - name: Make the web page
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        MESSAGE: ${{ inputs.message }}
      run: |
        mkdir -p site
        BUILT_AT="$(date -u '+%d %b %Y, %H:%M UTC')"
        cat > site/index.html <<EOF
        <!doctype html>
        <html lang="en" data-pipeit="true">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>$NAME's pipeline</title>
          <style>
            body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 16px; color: #0f172a; }
            .card { border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; }
            .ok { color: #059669; font-weight: 700; }
            li { margin: 6px 0; }
          </style>
        </head>
        <body>
          <div class="card">
            <p class="ok">✔ All checks passed</p>
            <h1>$NAME's CI/CD pipeline</h1>
            <p>$MESSAGE</p>
            <ul>
              <li>Run number: $GITHUB_RUN_NUMBER</li>
              <li>Commit: ${GITHUB_SHA::7}</li>
              <li>Built at: $BUILT_AT</li>
              <li>Started by: $GITHUB_EVENT_NAME</li>
            </ul>
            <p>PipeIt Weekend · SKILL.SCH</p>
          </div>
        </body>
        </html>
        EOF
        echo "Page written to site/index.html"

    - name: Write a summary on the run page
      shell: bash
      run: |
        echo "### ✅ Status card built" >> "$GITHUB_STEP_SUMMARY"
        echo "Run #$GITHUB_RUN_NUMBER for commit ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
